services:
  # 1. Next.js Frontend Web Service
  - type: web
    name: v-tech-frontend
    env: node
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: AGENT_BACKEND_URL
        fromService:
          type: web
          name: optimus-backend-api
          property: hostport
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: GEMINI_API_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: GUARDIAN_API_KEY
        sync: false

  # 2. FastAPI Web API Service
  - type: web
    name: optimus-backend-api
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/live
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: API_PREFIX
        value: /v1
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: AGENT_SERVICE_TOKEN
        sync: false
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-2.0-flash

  # 3. ARQ Background Task Worker
  - type: worker
    name: optimus-backend-worker
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: arq app.worker.WorkerSettings
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: AGENT_SERVICE_TOKEN
        sync: false
      - key: LLM_PROVIDER
        value: gemini
